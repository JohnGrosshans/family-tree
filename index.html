<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Private family tree</title>
<style>
:root{--bg:#edf0ee;--surface:#fbfcfa;--ink:#1d2830;--muted:#5a6872;--border:#cdd5d2;--focus:#1d6fd1;--err:#a3281f;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root{--bg:#121a1f;--surface:#1a252c;--ink:#e6ecea;--muted:#9aa9b1;--border:#2f3f48;--focus:#7ab4ff;--err:#ff8f86}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:26px 22px}
h1{font-family:var(--serif);font-size:30px;line-height:1.1;margin:0 0 6px}
p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-weight:600;font-size:14px;margin-bottom:4px;color:var(--ink)}
input[type=password]{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:17px}
input:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.rem{display:flex;align-items:center;gap:10px;margin:14px 0;font-weight:400;font-size:15px;min-height:44px}
.rem input{width:22px;height:22px;margin:0}
button{width:100%;min-height:48px;border:0;border-radius:8px;background:var(--ink);color:var(--surface);font:inherit;font-size:17px;font-weight:600;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
#msg{min-height:24px;margin:12px 0 0;color:var(--err);font-size:15px}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Private family tree</h1>
  <p>Enter the family password to open it.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
  <label class="rem"><input type="checkbox" id="rem"> Remember on this device</label>
  <button type="submit" id="go">Open</button>
  <p id="msg" role="alert"></p>
</form>

}

  msg.textContent="This browser can’t open the page here. Open it over https:// (for example from the GitHub Pages address).";
  go.disabled=true;
}
form.addEventListener("submit",function(e){
  e.preventDefault();
  if(!window.crypto||!crypto.subtle) return;
  msg.textContent="";go.disabled=true;go.textContent="Opening";
  var key;
  deriveKey(pw.value).then(function(k){key=k;return decryptWith(k);}).then(function(html){
    if(rem.checked) remember(key);
    show(html);
  }).catch(function(){
    go.disabled=false;go.textContent="Open";
    msg.textContent="That password didn’t work. Check it and try again.";
    pw.select();
  });
});
// Returning visitor on a device that chose "Remember"
try{
  var saved=localStorage.getItem("ftKey");
  if(saved&&window.crypto&&crypto.subtle){
    crypto.subtle.importKey("raw",b64(saved),"AES-GCM",false,["decrypt"]).then(decryptWith).then(show).catch(function(){
      try{localStorage.removeItem("ftKey");}catch(e){}
    });
  }
}catch(e){}
})();
</script>
</body>
